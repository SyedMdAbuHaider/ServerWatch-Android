name: Build ServerWatch

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Assemble release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ServerWatch-release
          path: android/app/build/outputs/apk/release/app-release.apk

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build agent
        working-directory: agent
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o serverwatch-agent-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o serverwatch-agent-linux-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: ServerWatch-agent
          path: |
            agent/serverwatch-agent-linux-amd64
            agent/serverwatch-agent-linux-arm64
      - name: Publish release assets on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agent/serverwatch-agent-linux-amd64
            agent/serverwatch-agent-linux-arm64
